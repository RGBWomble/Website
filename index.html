<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> <title>Social Links</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            flex-direction: column;
        }

        #globeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
            color: white;
            position: relative;
        }

        .social-button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border: none;
            background: transparent;
            transition: color 0.3s, text-shadow 0.3s;
            cursor: pointer;
            font-size: 24px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 10px rgba(255, 255, 255, 0.3);
        }

            .social-button:hover {
                color: rgba(255, 255, 255, 0.8);
                text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.7);
            }

        .logo {
            display: block;
            margin: 20px 0;
            max-width: 600px;
            width: 100%;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, #fc03db, #03fcf4);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translate(-50%, 50%);
            z-index: 10;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
        }

            .notification.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }

        .globe-container {
            position: relative;
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>

    <audio id="background-music" loop crossOrigin="anonymous">
        <source src="background-music.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('globeCanvas'), alpha: true });

            function resizeCanvas() {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            resizeCanvas();

            const gridSize = 1000;
            const divisions = 100;
            const gridHelper = new THREE.GridHelper(gridSize, divisions, 0xf707d7, 0xf707d7);
            gridHelper.position.y = 0;
            gridHelper.position.z = 0;
            scene.add(gridHelper);

            const geometry = new THREE.SphereGeometry(5, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
            const globe = new THREE.Mesh(geometry, material);
            globe.position.set(0, 10, 91);
            scene.add(globe);

            camera.position.set(0, 10, 100);

            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let velocity = { x: 0, y: 0 };

            // Audio Reactivity Setup
            const audio = document.getElementById('background-music');
            audio.volume = 0.25; 

            let audioContext, analyser, sourceNode, dataArray;
            let audioInitialized = false;

            function initAudio() {
                if (audioInitialized) {
                    // console.log("Audio already initialized."); // Kept for debugging if needed
                    return;
                }
                // console.log("Attempting to initialize AudioContext..."); // Kept for debugging
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    // console.log("AudioContext created. State:", audioContext.state); // Kept for debugging

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    // console.log("Analyser created."); // Kept for debugging

                    sourceNode = audioContext.createMediaElementSource(audio);
                    // console.log("MediaElementSource created."); // Kept for debugging

                    sourceNode.connect(analyser);
                    // console.log("SourceNode connected to Analyser."); // Kept for debugging

                    analyser.connect(audioContext.destination);
                    // console.log("Analyser connected to destination."); // Kept for debugging

                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    audioInitialized = true;
                    // console.log("Audio setup complete."); // Kept for debugging
                } catch (e) {
                    console.error("Error initializing audio:", e);
                }
            }

            function startAudioExperience() {
                // console.log("startAudioExperience called."); // Kept for debugging
                if (!audioInitialized) {
                    initAudio();
                }

                if (audioContext && audioContext.state === 'suspended') {
                    // console.log("AudioContext is suspended, attempting to resume..."); // Kept for debugging
                    audioContext.resume().then(() => {
                        // console.log("AudioContext resumed successfully. State:", audioContext.state); // Kept for debugging
                        playAudio();
                    }).catch(e => console.error("Error resuming AudioContext:", e));
                } else if (audioContext && audioContext.state === 'running') {
                    // console.log("AudioContext is already running."); // Kept for debugging
                    playAudio();
                } else {
                    // console.log("AudioContext not ready or in unexpected state for immediate play."); // Kept for debugging
                     if (audioInitialized) playAudio();
                }
            }

            function playAudio() {
                // console.log("Attempting to play audio..."); // Kept for debugging
                audio.play().then(() => {
                    // console.log("Audio playback started via audio.play()."); // Kept for debugging
                }).catch(error => {
                    console.error("Audio play failed:", error);
                });
            }

            function userInteractionHandler() {
                // console.log("User interaction detected (body click)."); // Kept for debugging
                startAudioExperience();
            }
            document.body.addEventListener('click', userInteractionHandler, { once: true });

            const discordButtonInteraction = document.querySelector('#discordButton');
             if (discordButtonInteraction) {
                discordButtonInteraction.addEventListener('click', function discordInteractionHandler() {
                    // console.log("User interaction detected (Discord button click)."); // Kept for debugging
                    startAudioExperience(); // This ensures audio starts if Discord button is first interaction
                }, { once: true });
             }

            window.addEventListener('mousedown', (event) => {
                isDragging = true;
                previousMousePosition = { x: event.clientX, y: event.clientY };
                velocity = { x: 0, y: 0 };
            });

            window.addEventListener('mousemove', (event) => {
                if (isDragging) {
                    const deltaMove = {
                        x: event.clientX - previousMousePosition.x,
                        y: event.clientY - previousMousePosition.y,
                    };
                    globe.rotation.y += deltaMove.x * 0.01;
                    globe.rotation.x += deltaMove.y * 0.01;
                    previousMousePosition = { x: event.clientX, y: event.clientY };
                    velocity.x = deltaMove.x * 0.01;
                    velocity.y = deltaMove.y * 0.01;
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            window.addEventListener('resize', resizeCanvas);

            function animate() {
                requestAnimationFrame(animate);

                if (audioInitialized && analyser) {
                    analyser.getByteFrequencyData(dataArray);

                    // Globe scaling - CALMED DOWN
                    let bassSum = 0;
                    for (let i = 0; i < 5; i++) {
                        bassSum += dataArray[i];
                    }
                    const averageBass = bassSum / 5;
                    const bassScaleFactor = 1 + (averageBass / 256) * 0.2; // Reduced from 0.5
                    globe.scale.set(bassScaleFactor, bassScaleFactor, bassScaleFactor);

                    // Grid color intensity - CALMED DOWN
                    let overallVolumeSum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        overallVolumeSum += dataArray[i];
                    }
                    const averageVolume = overallVolumeSum / dataArray.length;
                    const intensity = averageVolume / 256; // Divisor increased from 128

                    const originalColor = new THREE.Color(0xf707d7);
                    const pulsedColor = originalColor.clone().multiplyScalar(Math.max(0.5, intensity));
                    gridHelper.material.color.set(pulsedColor);
                    gridHelper.material.needsUpdate = true;
                }

                globe.rotation.y += 0.005;
                globe.rotation.x += 0.002;
                gridHelper.position.z += 0.1;
                if (gridHelper.position.z >= 50) {
                    gridHelper.position.z = 0;
                }

                if (!isDragging) {
                    globe.rotation.y += velocity.x;
                    globe.rotation.x += velocity.y;
                    velocity.x *= 0.95;
                    velocity.y *= 0.95;
                    if (Math.abs(velocity.x) < 0.001 && Math.abs(velocity.y) < 0.001) {
                        velocity.x = 0;
                        velocity.y = 0;
                    }
                }
                renderer.render(scene, camera);
            }
            animate();

            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `<div class="globe-container"><canvas id="smallGlobeCanvas" width="30" height="30"></canvas></div> Copied To Clipboard`;
            document.body.appendChild(notification);

            const discordButton = document.querySelector('#discordButton');
            discordButton.addEventListener('click', function (event) {
                event.preventDefault(); 
                // The audio start logic is handled by the separate 'once' listener now.
                // This click handler is primarily for the clipboard functionality.
                navigator.clipboard.writeText('rgbwomble').then(() => {
                    notification.classList.add('show');
                    const smallGlobeCanvas = document.getElementById('smallGlobeCanvas');
                    const smallGlobeRenderer = new THREE.WebGLRenderer({ canvas: smallGlobeCanvas, alpha: true });
                    smallGlobeRenderer.setSize(30, 30);
                    const smallGlobeScene = new THREE.Scene();
                    const smallGlobeCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                    smallGlobeCamera.position.z = 1;
                    const smallGlobeGeometry = new THREE.SphereGeometry(0.6, 6, 6);
                    const smallGlobeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
                    const smallGlobe = new THREE.Mesh(smallGlobeGeometry, smallGlobeMaterial);
                    smallGlobe.position.set(0, 0, 0);
                    smallGlobeScene.add(smallGlobe);
                    function animateSmallGlobe() {
                        requestAnimationFrame(animateSmallGlobe);
                        smallGlobe.rotation.y += 0.02;
                        smallGlobe.rotation.x += 0.01;
                        smallGlobeRenderer.render(smallGlobeScene, smallGlobeCamera);
                    }
                    animateSmallGlobe();
                    setTimeout(() => {
                        notification.classList.remove('show');
                        smallGlobeScene.remove(smallGlobe); 
                    }, 3000);
                }).catch(err => {
                    console.error('Could not copy text: ', err);
                });
            });
        });
    </script>

    <div class="container">
        <img class="logo" src="your-logo.png" alt="Logo"> <div class="social-buttons">
            <a href="https://www.youtube.com/@RGBWomble" class="social-button" target="_blank"><span>YouTube</span></a>
            <a href="https://steamcommunity.com/id/Airbus-A320/" class="social-button" target="_blank"><span>Steam</span></a>
            <a href="https://vrchat.com/home/user/usr_c9024204-5d4a-4249-851f-fb7b2fab21b2" class="social-button" target="_blank"><span>VRChat</span></a>
            <button class="social-button" id="discordButton"><span>Discord</span></button>
        </div>
    </div>
</body>
</html>
